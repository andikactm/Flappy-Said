<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#81d9ee">
  <title>FLAPPY SID</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Flappy Sid — Spasi, klik, atau tap untuk terbang">
    <canvas id="scene" width="430" height="764" aria-hidden="true"></canvas>
    <!-- Foto asli utuh: tanpa crop, filter, rotasi, atau animasi isi foto. -->
    <img id="player" src="assets/player.png" alt="Foto Sid sebagai player" draggable="false">
    <div id="score" aria-label="Skor saat ini">0</div>
    <section id="start-screen" class="screen">
      <h1>FLAPPY<br><span>SID</span></h1>
      <div class="start-instructions">
        <p>Press SPACE to Start</p>
        <p class="small">atau klik / tap layar</p>
        <span class="tag">FOTO ASLI. MIMPI TERBANG.</span>
      </div>
    </section>
    <section id="end-screen" class="screen" hidden aria-live="polite">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p id="joke"></p>
        <div class="results"><p>Score: <strong id="final-score">0</strong></p><p>Best: <strong id="best-score">0</strong></p></div>
        <button id="restart" type="button">MAIN LAGI</button>
        <p class="small">SPASI / KLIK / TAP = TERBANG</p>
      </div>
    </section>
    <div class="ground-label" aria-hidden="true">SID VS GRAVITY</div>
  </main>
</body>
</html>
